<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>늠읒 아카이브</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    /* ================================
       기본 초기화
    ================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

    html {
        width: 100%;
        overflow-x: hidden;
    }

    body {
        width: 100%;
        min-width: 0;
        font-family: "Noto Sans KR", sans-serif;
        background: var(--background);
        color: var(--text);
        line-height: 1.6;
        overflow-x: hidden;
    }

    :root {
        --blue: #147ef5;
        --dark-blue: #0b3d91;
        --text: #172033;
        --sub-text: #667085;
        --light-blue: #eef6ff;
        --border: #dce8f5;
        --background: #ffffff;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    button,
    input {
        font-family: inherit;
    }

    /* ================================
       전체 컨테이너
    ================================= */

.container {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding-left: 20px;
    padding-right: 20px;
}

    /* ================================
       Header
    ================================= */

    header {
        position: relative;
        width: 100%;
        padding: 32px 0 18px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
    }

    .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 30px;
    }

    .logo {
        flex-shrink: 0;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -1px;
        color: var(--dark-blue);
    }

    .logo span {
        color: var(--blue);
    }

    nav {
        display: flex;
        gap: 8px;
    }

    nav a {
        padding: 9px 14px;
        border-radius: 10px;
        color: var(--sub-text);
        font-size: 14px;
        transition: 0.2s ease;
    }

    nav a:hover,
    nav a.active {
        background: var(--light-blue);
        color: var(--blue);
    }

    .menu-button {
        display: none;
        flex-shrink: 0;
        border: none;
        background: transparent;
        font-size: 24px;
        cursor: pointer;
        color: var(--dark-blue);
    }

    /* ================================
       Hero
    ================================= */

    .hero {
        width: 100%;
        text-align: center;
        padding: 78px 0 45px;
    }

    .hero-label {
        display: inline-block;
        padding: 6px 12px;
        margin-bottom: 17px;
        background: var(--light-blue);
        border-radius: 999px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 600;
    }

    .hero h1 {
        font-size: clamp(38px, 6vw, 66px);
        line-height: 1.15;
        letter-spacing: -3px;
        color: var(--dark-blue);
        margin-bottom: 18px;
        word-break: keep-all;
    }

    .hero p {
        color: var(--sub-text);
        font-size: 16px;
        max-width: 600px;
        margin: 0 auto 34px;
        word-break: keep-all;
    }

    /* ================================
       Search
    ================================= */

.search-box {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    position: relative;
    min-width: 0;
}


    .search-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--sub-text);
        font-size: 20px;
        pointer-events: none;
        z-index: 1;
    }
	
}

.search-box input {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    height: 62px;
    padding: 0 55px;
    border: 1px solid var(--border);
    border-radius: 18px;
    outline: none;
    font-size: 15px;
    background: white;
    box-shadow: 0 8px 30px rgba(20, 126, 245, 0.07);
    transition: 0.25s ease;
    box-sizing: border-box;
}
	
    .search-box input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(20, 126, 245, 0.1);
    }

    /* ================================
       Category
    ================================= */

    .category-section {
        padding: 15px 0 45px;
    }

    .section-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 18px;
    }

    .section-title h2 {
        font-size: 18px;
        color: var(--dark-blue);
    }

    .result-count {
        flex-shrink: 0;
        font-size: 13px;
        color: var(--sub-text);
    }

    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
    }

    .tag {
        border: 1px solid var(--border);
        background: white;
        color: #506078;
        padding: 8px 15px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        transition: 0.2s ease;
        white-space: nowrap;
    }

    .tag:hover {
        border-color: var(--blue);
        color: var(--blue);
    }

    .tag.active {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
    }

    /* ================================
       Works
    ================================= */

    .works-section {
        padding: 20px 0 90px;
        background: #f8fbff;
        border-top: 1px solid #edf4fb;
    }

    .works-header {
        padding: 35px 0 22px;
    }

    .works-header h2 {
        font-size: 24px;
        color: var(--dark-blue);
        letter-spacing: -1px;
    }

    .works-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
    }

    /* ================================
       Card
    ================================= */

    .work-card {
        min-width: 0;
        background: white;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 25px;
        min-height: 310px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .work-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 35px rgba(20, 80, 140, 0.09);
    }

    .work-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
    }

    .period {
        color: var(--sub-text);
        font-size: 12px;
    }

    .work-card h3 {
        min-width: 0;
        font-size: 21px;
        color: var(--dark-blue);
        margin-bottom: 5px;
        letter-spacing: -0.7px;
        word-break: keep-all;
        overflow-wrap: break-word;
    }

    .author {
        color: var(--blue);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 15px;
    }

    .description {
        color: var(--sub-text);
        font-size: 14px;
        line-height: 1.75;
        margin-bottom: 20px;
        word-break: keep-all;
        overflow-wrap: anywhere;
    }

    .card-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: auto;
        margin-bottom: 20px;
    }

    .card-tag {
        background: var(--light-blue);
        color: var(--blue);
        padding: 5px 9px;
        border-radius: 7px;
        font-size: 11px;
        white-space: nowrap;
    }

    .original-button {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        width: 100%;
        min-width: 0;
        padding: 11px;
        border-radius: 10px;
        background: var(--blue);
        color: white;
        font-size: 13px;
        font-weight: 600;
        transition: 0.2s ease;
    }

    .original-button:hover {
        background: var(--dark-blue);
    }

    /* ================================
       Empty
    ================================= */

    .empty {
        display: none;
        text-align: center;
        padding: 70px 20px;
        color: var(--sub-text);
    }

    .empty-icon {
        font-size: 35px;
        margin-bottom: 12px;
    }

    .empty h3 {
        color: var(--dark-blue);
        margin-bottom: 5px;
    }

    /* ================================
       Footer
    ================================= */

    footer {
        border-top: 1px solid var(--border);
        padding: 30px 0;
        color: var(--sub-text);
        font-size: 12px;
        text-align: center;
    }

    /* ================================
       Tablet
    ================================= */

    @media (max-width: 850px) {

        .container {
            width: calc(100% - 32px);
            max-width: 1180px;
        }

        .works-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        nav {
            display: none;
            position: absolute;
            left: 16px;
            right: 16px;
            top: calc(100% + 8px);
            width: auto;
            background: white;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(20, 80, 140, 0.1);
            z-index: 100;
        }

        nav.open {
            display: flex;
            flex-direction: column;
        }

        nav a {
            display: block;
            width: 100%;
        }

        .menu-button {
            display: block;
        }
    }

    /* ================================
       Mobile
    ================================= */

    @media (max-width: 600px) {
        .container {
            width: 100%;
            max-width: 1180px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 14px;
            padding-right: 14px;
        }

        header {
            padding: 18px 0;
        }

        .header-inner {
            gap: 12px;
            min-width: 0;
        }

        .logo {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .logo {
            font-size: 21px;
            letter-spacing: -0.8px;
        }

        .menu-button {
            font-size: 22px;
            padding: 2px;
        }

        nav {
            left: 14px;
            right: 14px;
        }

        .hero {
            padding: 45px 0 30px;
        }

        .hero-label {
            font-size: 11px;
            padding: 5px 10px;
            margin-bottom: 14px;
        }

        .hero h1 {
            font-size: 34px;
            line-height: 1.2;
            letter-spacing: -2px;
            word-break: keep-all;
        }

        .hero p {
            font-size: 14px;
            line-height: 1.65;
            margin-bottom: 25px;
        }

        /* 검색창 핵심 수정 */
        .hero .container {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .search-box {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .search-box input {
            display: block;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            height: 54px;
            padding: 0 46px;
            border-radius: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-icon {
            left: 16px;
            font-size: 18px;
        }

        .category-section {
            padding: 10px 0 35px;
        }

        .section-title {
            align-items: center;
            margin-bottom: 15px;
            min-width: 0;
        }

        .section-title h2 {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .section-title h2 {
            font-size: 17px;
        }

        .result-count {
            font-size: 12px;
        }

        .tags {
            gap: 6px;
        }

        .tag {
            padding: 7px 11px;
            font-size: 12px;
        }

        .works-section {
            padding: 10px 0 60px;
        }

        .works-header {
            padding: 25px 0 18px;
        }

        .works-header h2 {
            font-size: 21px;
        }

        .works-grid {
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .work-card {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: auto;
            padding: 20px;
            border-radius: 15px;
        }

        .work-meta,
        .card-tags {
            min-width: 0;
            max-width: 100%;
        }

        .period,
        .author {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .work-card h3 {
            font-size: 19px;
            line-height: 1.4;
        }

        .author {
            font-size: 13px;
        }

        .description {
            font-size: 13px;
            line-height: 1.7;
        }

        .original-button {
            min-height: 42px;
        }

        footer {
            padding: 25px 0;
        }
    }

    /* ================================
       아주 작은 휴대폰
    ================================= */

    @media (max-width: 380px) {

        .hero .container {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .search-box {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .search-box input {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1180px;
            padding-left: 12px;
            padding-right: 12px;
        }

        .logo {
            font-size: 19px;
        }

        .hero {
            padding-top: 38px;
        }

        .hero h1 {
            font-size: 30px;
            letter-spacing: -1.8px;
        }

        .hero p {
            font-size: 13px;
        }

        .search-box input {
            height: 52px;
            padding-left: 42px;
            padding-right: 15px;
            font-size: 13px;
        }

        .search-icon {
            left: 14px;
        }

        .work-card {
            padding: 18px;
        }

        .tag {
            padding: 6px 10px;
            font-size: 11px;
        }
    }
</style>
</head>

<body>

<header>
    <div class="container header-inner">

        <a href="#" class="logo">
            <span>늠읒</span> 아카이브
        </a>

        <nav id="navigation">
            <a href="#" class="active">홈</a>
            <a href="#works">작품</a>
            <a href="#categories">분류</a>
            <a href="#guide">가이드</a>
        </nav>

        <button class="menu-button" id="menuButton">
            ☰
        </button>

    </div>
</header>


<main>

    <!-- Hero -->

    <section class="hero">
        <div class="container">

            <span class="hero-label">NW LITERARY ARCHIVE</span>

            <h1>늠읒 포타 아카이브</h1>

            <p>

            <div class="search-box">

    <!-- Categories -->

    <section class="category-section" id="categories">

            </div>

            <div class="tags" id="tagContainer">

                <button class="tag active" data-category="전체">
                    전체
                </button>

                <button class="tag" data-category="청게">

                </button>

                <button class="tag" data-category="캠게">

                </button>

                <button class="tag" data-category="오메가버스">
                    오메가버스
                </button>

                <button class="tag" data-category="판타지">
                    판타지
                </button>

                <button class="tag" data-category="마법소년물">
                    마법소년물
                </button>

                <button class="tag" data-category="연예계">
                    연예계
                </button>

                <button class="tag" data-category="노장">
                    노장
                </button>

                <button class="tag" data-category="19">
                    19
                </button>

                <button class="tag" data-category="코미디">
                    코미디
                </button>

                <button class="tag" data-category="정략결혼">
                    정략결혼
                </button>

                <button class="tag" data-category="성인미자">
                    성인미자
                </button>

                <button class="tag" data-category="짭근친">
                    짭근친
                </button>

                <button class="tag" data-category="타씨피 언급">
                    타씨피 언급
                </button>

                <button class="tag" data-category="수인물">
                    수인물
                </button>

                <button class="tag" data-category="모브 언급">
                    모브 언급
                </button>

                <button class="tag" data-category="그림">
                    그림
                </button>

                <button class="tag" data-category="기타">
                    기타
                </button>

            </div>

        </div>

    </section>


    <!-- Works -->

    <section class="works-section" id="works">

        <div class="container">

            <div class="works-header">
                <h2 id="worksCount">52개의 작품</h2>
            </div>

            <div class="works-grid" id="worksGrid"></div>

            <div class="empty" id="emptyState">

                <div class="empty-icon">⌕</div>

                <h3>작품을 찾을 수 없습니다.</h3>

                <p>
                    다른 작품명, 작가명 또는 키워드로 검색해 보세요.
                </p>

            </div>

        </div>

    </section>

</main>


<footer id="guide">
    <div class="container">
        <div style="margin-bottom: 8px; font-size: 16px; font-weight: 700; color: var(--dark-blue);">
            늠읒 아카이브
        </div>
        <div>
            늠읒 아카이브 · @cozuiq
<p>

    </div>
</footer>


<script>

    /*
    =====================================
    작품 데이터

        },

            categories: ["청게", "기타"],

        },

        {

            author: "설기",

            description: "옛날 옛날, 아주 먼 옛날, 쥐새끼가 치즈 먹던 시절에 늠냥이라는 고양이가 살았더래요.",
            categories: ["판타지", "기타"],
            url: "https://posty.pe/pg19q3fc"
        },

        {
            title: "로그",
            author: "ㅊㅇ",
            period: "26.03.12",
            description: "돌판도 팬아트 그림 백업 이런거 모아서 하는지 모르겠는데 제가 씹덕 출신이라 걍 해봐요",
            categories: ["그림", "기타"],
            url: "https://posty.pe/prkgrpjc"
        }

    ];


    const worksGrid = document.getElementById("worksGrid");
    const searchInput = document.getElementById("searchInput");
    const resultCount = document.getElementById("resultCount");
    const worksCount = document.getElementById("worksCount");
    const emptyState = document.getElementById("emptyState");
    const tagButtons = document.querySelectorAll(".tag");


    let currentCategory = "전체";


    /*
    =====================================
    작품 카드 생성
    =====================================
    */

    function displayWorks() {

        const searchValue =
            searchInput.value.toLowerCase().trim();

        const filteredWorks = works.filter(work => {

            const matchesCategory =
                currentCategory === "전체" ||
                work.categories.includes(currentCategory);

            const searchableText =
                `${work.title}
                ${work.author}
                ${work.description}
                ${work.categories.join(" ")}`.toLowerCase();

            const matchesSearch =
                searchableText.includes(searchValue);

            return matchesCategory && matchesSearch;
        });


        worksGrid.innerHTML = "";


        filteredWorks.forEach(work => {

            const card = document.createElement("article");

            card.className = "work-card";

            card.innerHTML = `

                <div class="work-meta">
                    <span class="period">
                        ${work.period}
                    </span>
                </div>

                <h3>
                    ${work.title}
                </h3>

                <div class="author">
                    ${work.author}
                </div>

                <p class="description">
                    ${work.description}
                </p>

                <div class="card-tags">

                    ${work.categories.map(category => `
                        <span class="card-tag">
                            ${category}
                        </span>
                    `).join("")}

                </div>

                <a
                    href="${work.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="original-button"
                >
                    원문 보기 ↗
                </a>

            `;

            worksGrid.appendChild(card);

        });


        resultCount.textContent =
            `${filteredWorks.length}개의 작품`;

        worksCount.textContent =
            `${filteredWorks.length}개의 작품`;


        if (filteredWorks.length === 0) {

            emptyState.style.display = "block";

        } else {

            emptyState.style.display = "none";

        }

    }


    /*
    =====================================
    검색
    =====================================
    */

    searchInput.addEventListener(
        "input",
        displayWorks
    );


    /*
    =====================================
    카테고리 필터
    =====================================
    */

    tagButtons.forEach(button => {

        button.addEventListener("click", () => {

            tagButtons.forEach(tag => {
                tag.classList.remove("active");
            });

            button.classList.add("active");

            currentCategory =
                button.dataset.category;

            displayWorks();

        });

    });


    /*
    =====================================
    모바일 메뉴
    =====================================
    */

    const menuButton =
        document.getElementById("menuButton");

    const navigation =
        document.getElementById("navigation");


    menuButton.addEventListener("click", () => {
        navigation.classList.toggle("open");
    });

    // 모바일에서 메뉴를 선택하면 메뉴를 닫습니다.
    navigation.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", () => {
            navigation.classList.remove("open");
        });
    });

    /*
    초기 화면
    */

    displayWorks();

</script>
